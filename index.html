      const FIXED_DAY = "17";
      const FIXED_MONTH = "October";
      const FIXED_YEAR = "2026";

      function forceWeddingDate() {
        const dayCanvas = document.getElementById('tdr-numcvs-day');
        const monthCanvas = document.getElementById('tdr-numcvs-month');
        const yearCanvas = document.getElementById('tdr-numcvs-year');

        function drawText(canvas, text) {
          if (!canvas) return;

          const ctx = canvas.getContext('2d');
          const rect = canvas.getBoundingClientRect();

          const dpr = window.devicePixelRatio || 1;

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, rect.width, rect.height);

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#B87520';

          let fontSize = Math.min(rect.width * 0.25, 28);

          if (text === FIXED_MONTH) {
            fontSize = Math.min(rect.width * 0.20, 25);
          }

          if (text === FIXED_YEAR) {
            fontSize = Math.min(rect.width * 0.25, 28);
          }

          ctx.font = fontSize + "px Georgia, serif";

          ctx.fillText(
            text,
            rect.width / 2,
            rect.height / 2
          );
        }

        drawText(dayCanvas, FIXED_DAY);
        drawText(monthCanvas, FIXED_MONTH);
        drawText(yearCanvas, FIXED_YEAR);
      }
